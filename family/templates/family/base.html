<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Relationship Navigator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a84c;
            --gold-light: #e8d5a3;
            --dark: #0e0e1a;
            --dark2: #16162a;
            --dark3: #1e1e35;
            --text: #f0ead6;
            --text-muted: #9a8f7a;
            --male: #2d6a9f;
            --female: #9f2d6a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--dark);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background: rgba(14,14,26,0.95) !important;
            border-bottom: 1px solid rgba(201,168,76,0.3);
            padding: 14px 32px;
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar-brand {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            color: var(--gold) !important;
            letter-spacing: 1px;
        }
        .navbar-brand span { color: var(--text); }
        .nav-link-custom {
            color: var(--text-muted) !important;
            font-size: 13px;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 6px;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }
        .nav-link-custom:hover {
            color: var(--gold) !important;
            background: rgba(201,168,76,0.1);
        }
        .nav-btn {
            background: linear-gradient(135deg, #c9a84c, #a07830);
            color: #0e0e1a !important;
            font-weight: 600;
            font-size: 13px;
            padding: 6px 18px;
            border-radius: 20px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .nav-btn:hover { opacity: 0.85; transform: translateY(-1px); }

        /* Main content */
        .main-content {
            padding: 40px 32px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Cards */
        .frn-card {
            background: var(--dark2);
            border: 1px solid rgba(201,168,76,0.15);
            border-radius: 16px;
            padding: 28px;
            transition: all 0.3s;
        }
        .frn-card:hover {
            border-color: rgba(201,168,76,0.4);
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(201,168,76,0.1);
        }

        /* Page title */
        .page-title {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            color: var(--gold);
            margin-bottom: 6px;
        }
        .page-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 32px;
        }

        /* Tables */
        .frn-table {
            width: 100%;
            border-collapse: collapse;
        }
        .frn-table th {
            background: var(--dark3);
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-size: 12px;
            letter-spacing: 1px;
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid rgba(201,168,76,0.2);
        }
        .frn-table td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: var(--text);
            font-size: 14px;
        }
        .frn-table tr:hover td { background: rgba(201,168,76,0.05); }

        /* Buttons */
        .btn-gold {
            background: linear-gradient(135deg, #c9a84c, #a07830);
            color: #0e0e1a;
            font-weight: 600;
            font-size: 13px;
            padding: 8px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }
        .btn-gold:hover { opacity: 0.85; color: #0e0e1a; transform: translateY(-1px); }
        .btn-outline-gold {
            background: transparent;
            color: var(--gold);
            border: 1px solid rgba(201,168,76,0.4);
            font-size: 13px;
            padding: 7px 18px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }
        .btn-outline-gold:hover {
            background: rgba(201,168,76,0.1);
            color: var(--gold);
        }
        .btn-danger-soft {
            background: rgba(220,53,69,0.15);
            color: #ff6b7a;
            border: 1px solid rgba(220,53,69,0.3);
            font-size: 13px;
            padding: 7px 18px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }
        .btn-danger-soft:hover {
            background: rgba(220,53,69,0.3);
            color: #ff6b7a;
        }

        /* Forms */
        .frn-input {
            width: 100%;
            background: var(--dark3);
            border: 1px solid rgba(201,168,76,0.2);
            border-radius: 8px;
            color: var(--text);
            padding: 10px 14px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .frn-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
        }
        .frn-input option { background: var(--dark2); }
        .frn-label {
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: block;
        }

        /* Alerts */
        .frn-alert {
            background: var(--dark3);
            border: 1px solid rgba(201,168,76,0.2);
            border-radius: 10px;
            padding: 16px 20px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Divider */
        .gold-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 32px 0;
            opacity: 0.3;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.3); border-radius: 3px; }
    </style>
</head>
<body>
<nav class="navbar">
    <div style="display:flex; align-items:center; gap:32px; width:100%;">
        <a class="navbar-brand" href="/dashboard/">🌳 <span>Family</span> Navigator</a>
        {% if user.is_authenticated %}
        <div style="display:flex; gap:8px; align-items:center;">
            <a href="/members/" class="nav-link-custom">Members</a>
            <a href="/relationships/" class="nav-link-custom">Relationships</a>
            <a href="/find/" class="nav-link-custom">Find</a>
            <a href="/tree/" class="nav-link-custom">Tree</a>
        </div>
        <div style="margin-left:auto; display:flex; align-items:center; gap:16px;">
            <span style="color:var(--text-muted); font-size:13px;">👤 {{ user.username }}</span>
            <a href="/logout/" class="btn-outline-gold">Logout</a>
        </div>
        {% else %}
        <div style="margin-left:auto; display:flex; gap:10px;">
            <a href="/login/" class="btn-outline-gold">Login</a>
            <a href="/register/" class="btn-gold">Register</a>
        </div>
        {% endif %}
    </div>
</nav>

<div class="main-content">
    {% block content %}{% endblock %}
</div>
</body>
</html>
